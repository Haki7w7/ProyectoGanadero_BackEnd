openapi: 3.1.0
info:
  title: 'Sistema de Gestión Ganadera - API Docs'
  version: 0.0.1
  description: 'Documentación interactiva de la API REST para la gestión y trazabilidad ganadera (Laboratorio 5).'
servers:
  -
    url: 'http://localhost:8000/api'
security:
  -
    http: {}
paths:
  /user:
    get:
      responses:
        200:
          description: '`User`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/animales:
    get:
      operationId: animales.index
      description: 'Retorna el listado paginado de animales con soporte de filtros por raza, potrero, sexo o estado, y ordenamiento dinámico.'
      summary: 'Listar animales'
      tags:
        - Animales
        - Animal
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
      security: {}
    post:
      operationId: animales.store
      description: 'Valida los datos y registra un nuevo animal, verificando la capacidad disponible del potrero seleccionado.'
      summary: 'Registrar un nuevo animal'
      tags:
        - Animales
        - Animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAnimalRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 201
        422:
          $ref: '#/components/responses/ValidationException'
      security: {}
  '/v1/animales/{id}':
    get:
      operationId: animales.show
      description: 'Retorna la información completa de un animal por su ID, incluyendo raza, potrero, pesajes y tratamientos.'
      summary: 'Obtener detalle de un animal'
      tags:
        - Animales
        - Animal
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
      security: {}
    put:
      operationId: animales.update
      description: 'Actualiza la información del animal especificado por su ID.'
      summary: 'Actualizar datos de un animal'
      tags:
        - Animales
        - Animal
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnimalRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
        422:
          $ref: '#/components/responses/ValidationException'
      security: {}
    delete:
      operationId: animales.destroy
      description: 'Elimina el animal del sistema. Falla si el animal tiene historial de pesajes registrados (RN-01).'
      summary: 'Eliminar un animal'
      tags:
        - Animales
        - Animal
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
      security: {}
  /v1/auth/login:
    post:
      operationId: login
      description: 'Valida las credenciales del usuario y genera un token de acceso personal (Bearer Token).'
      summary: 'Iniciar sesión'
      tags:
        - Autenticación
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
        422:
          $ref: '#/components/responses/ValidationException'
      security: {}
  /v1/auth/register:
    post:
      operationId: register
      description: 'Registra un nuevo usuario con rol asignado (admin, operario, veterinario) y emite un token Bearer.'
      summary: 'Registrar usuario'
      tags:
        - Autenticación
        - Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 201
        422:
          $ref: '#/components/responses/ValidationException'
      security: {}
  /v1/categorias:
    get:
      operationId: categorias.index
      tags:
        - Categoria
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'Listado de categorías obtenido correctamente.'
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Categoria'
                      first_page_url:
                        type:
                          - string
                          - 'null'
                      from:
                        type:
                          - integer
                          - 'null'
                        minimum: 1
                      last_page_url:
                        type:
                          - string
                          - 'null'
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: 'Generated paginator links.'
                        items:
                          type: object
                          properties:
                            url:
                              type:
                                - string
                                - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                            - url
                            - label
                            - active
                      next_page_url:
                        type:
                          - string
                          - 'null'
                      path:
                        type:
                          - string
                          - 'null'
                        description: 'Base path for paginator generated URLs.'
                      per_page:
                        type: integer
                        description: 'Number of items shown per page.'
                        minimum: 0
                      prev_page_url:
                        type:
                          - string
                          - 'null'
                      to:
                        type:
                          - integer
                          - 'null'
                        description: 'Number of the last item in the slice.'
                        minimum: 1
                      total:
                        type: integer
                        description: 'Total number of items being paginated.'
                        minimum: 0
                    required:
                      - current_page
                      - data
                      - first_page_url
                      - from
                      - last_page_url
                      - last_page
                      - links
                      - next_page_url
                      - path
                      - per_page
                      - prev_page_url
                      - to
                      - total
                required:
                  - message
                  - data
      security: {}
    post:
      operationId: categorias.store
      tags:
        - Categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoriaRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'Categoría creada correctamente.'
