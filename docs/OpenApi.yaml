openapi: 3.1.0
info:
  title: Sistema de Gestión Ganadera - API Docs
  version: 0.0.1
  description: >-
    Documentación interactiva de la API REST para la gestión y trazabilidad
    ganadera de la empresa. Permite a los desarrolladores explorar y probar los
    endpoints de la API, facilitando la integración con sistemas externos y
    aplicaciones móviles.
servers:
  - url: 'http://localhost:8000/api'
tags:
  - name: Autenticación
security:
  - http: []
paths:
  /v1/auth/login:
    post:
      operationId: login
      description: >-
        Valida las credenciales del usuario y genera un token de acceso personal
        (Bearer Token).
      summary: Iniciar sesión
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 200
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  /v1/auth/register:
    post:
      operationId: register
      description: >-
        Registra un nuevo usuario con rol asignado (admin, operario,
        veterinario) y emite un token Bearer.
      summary: Registrar usuario
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                const: 201
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  /user:
    get:
      responses:
        '200':
          description: '`User`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/AuthenticationException'
  /v1/animales:
    get:
      operationId: animales.index
      description: >-
        Retorna el listado paginado de animales registrados en el sistema con
        soporte de filtros y ordenamiento.
      summary: Listar animales
      tags:
        - Animal
      responses:
        '200':
          description: Paginated set of `AnimalResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnimalCollection'
                  message:
                    type: string
                    const: Listado de animales obtenido correctamente.
                required:
                  - data
                  - message
      security: []
    post:
      operationId: animales.store
      description: >-
        Valida los datos recibidos y registra un nuevo animal en el sistema.

        Valida la capacidad máxima del potrero asignado antes de completar el
        registro.
      summary: Registrar un nuevo animal
      tags:
        - Animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAnimalRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Animal creado correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/AnimalResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  '/v1/animales/{id}':
    get:
      operationId: animales.show
      description: >-
        Retorna la información completa de un animal específico por su ID,

        incluyendo sus relaciones con raza, potrero, historial de pesajes y
        tratamientos.
      summary: Obtener detalle de un animal
      tags:
        - Animal
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del animal.
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Animal obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/AnimalResource'
                required:
                  - message
                  - data
      security: []
    put:
      operationId: animales.update
      description: >-
        Actualiza la información de un animal existente por su ID.

        Si se modifica la asignación de potrero, valida que el nuevo potrero
        tenga capacidad disponible.
      summary: Actualizar datos de un animal
      tags:
        - Animal
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del animal a actualizar.
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnimalRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Animal actualizado correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/AnimalResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
    delete:
      operationId: animales.destroy
      description: >-
        Elimina el registro de un animal del sistema por su ID.

        Impide la eliminación si el animal posee registros de pesaje en su
        historial.
      summary: Eliminar un animal
      tags:
        - Animal
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del animal a eliminar.
          schema:
            type:
              - integer
              - string
      responses:
        '204':
          description: No content
      security: []
  '/v1/potreros/{potrero}/animales':
    get:
      operationId: potreros.animales.index
      description: >-
        Retorna el listado paginado de animales asignados a un potrero
        específico.

        Valida previamente la existencia del potrero indicado en la ruta.
      summary: Listar animales por potrero
      tags:
        - Animal
      parameters:
        - name: potrero
          in: path
          required: true
          description: Identificador único del potrero.
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de animales del potrero obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                      - current_page
                      - last_page
                      - per_page
                      - total
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
  '/v1/razas/{raza}/animales':
    get:
      operationId: razas.animales.index
      description: >-
        Retorna el listado paginado de animales pertenecientes a una raza
        específica.

        Valida previamente la existencia de la raza indicada en la ruta.
      summary: Listar animales por raza
      tags:
        - Animal
      parameters:
        - name: raza
          in: path
          required: true
          description: Identificador único de la raza.
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de animales de la raza obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                      - current_page
                      - last_page
                      - per_page
                      - total
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
  /v1/categorias:
    get:
      operationId: categorias.index
      description: Retorna el listado paginado de categorías registradas en el sistema.
      summary: Listar categorías
      tags:
        - Categoria
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de categorías obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                      - current_page
                      - last_page
                      - per_page
                      - total
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
    post:
      operationId: categorias.store
      description: Valida los datos y registra una nueva categoría en el sistema.
      summary: Registrar una nueva categoría
      tags:
        - Categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoriaRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Categoría creada correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/CategoriaResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  '/v1/categorias/{id}':
    get:
      operationId: categorias.show
      description: Retorna la información de una categoría específica por su ID.
      summary: Obtener detalle de una categoría
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Categoría obtenida correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/CategoriaResource'
                required:
                  - message
                  - data
      security: []
    put:
      operationId: categorias.update
      description: Actualiza la información de una categoría existente por su ID.
      summary: Actualizar una categoría
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoriaRequest'
      responses:
        '200':
          description: ''
          content:
