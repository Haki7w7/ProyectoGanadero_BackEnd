              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Categoría actualizada correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/CategoriaResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
    delete:
      operationId: categorias.destroy
      description: Elimina del sistema la categoría indicada por su ID.
      summary: Eliminar una categoría
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
      security: []
  /v1/insumos:
    get:
      operationId: insumos.index
      description: >-
        Retorna el listado paginado de insumos agrícolas o veterinarios
