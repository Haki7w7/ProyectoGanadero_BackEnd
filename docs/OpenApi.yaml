                        type: string
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
  /v1/pesajes:
    get:
      operationId: pesajes.index
      description: >-
        Retorna el listado paginado de registros de pesaje con soporte de
        filtros.
      summary: Listar pesajes
      tags:
        - Pesaje
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de pesajes obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
