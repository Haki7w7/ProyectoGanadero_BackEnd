                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
    post:
      operationId: pesajes.store
      description: Valida los datos y registra un nuevo pesaje en el sistema.
      summary: Registrar un nuevo pesaje
      tags:
        - Pesaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePesajeRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
