components:
  securitySchemes:
    http:
      type: http
      scheme: bearer
  schemas:
    AnimalCollection:
      type: array
      items:
        allOf:
          - $ref: '#/components/schemas/AnimalResource'
          - type: object
            required:
              - raza
              - potrero
      title: AnimalCollection
    AnimalResource:
      type: object
      properties:
        id_animal:
          type: integer
        numero_arete:
          type: string
        sexo:
          type: string
        fecha_nacimiento:
          type:
            - string
            - 'null'
        estado:
          type: string
        raza_id:
          type: integer
        potrero_id:
          type: integer
        raza:
          $ref: '#/components/schemas/RazaResource'
        potrero:
          $ref: '#/components/schemas/PotreroResource'
        pesajes:
          type: array
          items:
            $ref: '#/components/schemas/PesajeResource'
        tratamientos:
          type: array
          items:
            $ref: '#/components/schemas/TratamientoResource'
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
      required:
        - id_animal
        - numero_arete
        - sexo
        - fecha_nacimiento
        - estado
        - raza_id
        - potrero_id
        - created_at
        - updated_at
      title: AnimalResource
    CategoriaResource:
      type: object
      properties:
        categoria_id:
          type: integer
        nombre:
          type: string
        tipo:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
      required:
        - categoria_id
        - nombre
        - tipo
        - created_at
        - updated_at
      title: CategoriaResource
    InsumoResource:
      type: object
      properties:
        insumo_id:
          type: integer
        nombre:
          type: string
        categoria_id:
          type: integer
        precio:
          type: number
        unidad_medida_id:
          type: integer
        categoria:
          $ref: '#/components/schemas/CategoriaResource'
        unidad_medida:
          $ref: '#/components/schemas/UnidadMedidaResource'
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
      required:
        - insumo_id
        - nombre
        - categoria_id
        - precio
        - unidad_medida_id
        - created_at
        - updated_at
      title: InsumoResource
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
      title: LoginRequest
    PesajeResource:
      type: object
      properties:
        pesaje_id:
          type: integer
        id_animal:
          type: integer
        peso_kg:
          type: number
        fecha_pesaje:
          type:
            - string
            - 'null'
        observaciones:
          type:
            - string
            - 'null'
        animal:
          type: object
          description: 'Resumen del animal, solo si la relación fue cargada.'
          properties:
            id_animal:
              type: integer
            numero_arete:
              type: string
          required:
            - id_animal
            - numero_arete
        created_at:
          type:
            - string
