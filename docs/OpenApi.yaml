                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  '/v1/pesajes/{id}':
    get:
      operationId: pesajes.show
      description: Retorna la información completa de un registro de pesaje por su ID.
      summary: Obtener detalle de un pesaje
      tags:
        - Pesaje
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Pesaje obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/PesajeResource'
                required:
                  - message
                  - data
      security: []
    put:
      operationId: pesajes.update
      description: Actualiza los datos de un registro de pesaje existente por su ID.
      summary: Actualizar un pesaje
      tags:
        - Pesaje
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePesajeRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Pesaje actualizado correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/PesajeResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
    delete:
      operationId: pesajes.destroy
      description: Elimina el registro de pesaje indicado del sistema.
      summary: Eliminar un pesaje
      tags:
        - Pesaje
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
      security: []
  '/v1/animales/{animal}/pesajes':
    get:
      operationId: animales.pesajes.index
      description: >-
        Retorna el historial cronológico de pesajes asociados a un animal
        específico.
      summary: Listar pesajes de un animal
      tags:
        - Pesaje
      parameters:
        - name: animal
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de pesajes del animal obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                      - current_page
                      - last_page
                      - per_page
                      - total
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type:
                          - string
                          - 'null'
                      next:
                        type:
                          - string
                          - 'null'
                    required:
                      - first
                      - last
                      - prev
                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
    post:
      operationId: animales.pesajes.store
      description: >-
        Registra un nuevo pesaje vinculado directamente al animal indicado en la
        ruta.
      summary: Registrar pesaje para un animal
      tags:
        - Pesaje
      parameters:
        - name: animal
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePesajeAnimalRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
