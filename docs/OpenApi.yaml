      summary: Listar insumos
      tags:
        - Insumo
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Listado de insumos obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties:
