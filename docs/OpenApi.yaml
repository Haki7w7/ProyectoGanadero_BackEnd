                      - next
                required:
                  - message
                  - data
                  - meta
                  - links
      security: []
    post:
      operationId: insumos.store
      description: Valida los datos y registra un nuevo insumo en el inventario.
      summary: Registrar un nuevo insumo
      tags:
        - Insumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInsumoRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Insumo creado correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/InsumoResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
  '/v1/insumos/{id}':
    get:
      operationId: insumos.show
      description: Retorna la información de un insumo específico por su ID.
      summary: Obtener detalle de un insumo
      tags:
        - Insumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Insumo obtenido correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/InsumoResource'
                required:
                  - message
                  - data
      security: []
    put:
      operationId: insumos.update
      description: Actualiza la información y existencias de un insumo existente por su ID.
      summary: Actualizar datos de un insumo
      tags:
        - Insumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInsumoRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Insumo actualizado correctamente.
                  data:
                    anyOf:
                      - type: string
                      - $ref: '#/components/schemas/InsumoResource'
                required:
                  - message
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
      security: []
    delete:
      operationId: insumos.destroy
      description: Elimina el insumo indicado del sistema por su ID.
      summary: Eliminar un insumo
      tags:
        - Insumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
      security: []
  '/v1/categorias/{categoria}/insumos':
